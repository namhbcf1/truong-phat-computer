[package]
name = "truongphatcomputer-cli"
version.workspace = true
description = "TruongPhatComputer command-line automation adapter"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "truongphatcomputer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
env_logger = "0.11.11"
truongphatcomputer-core = { path = "../truongphatcomputer-core" }
truongphatcomputer-platform = { path = "../truongphatcomputer-platform" }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
