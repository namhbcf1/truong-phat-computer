name: Release Windows installer

# Produces the distributable NSIS installer with an Authenticode signature.
# The self-signed project certificate signs every build today; once SignPath
# Foundation approves the project, the optional `signpath` job replaces the
# signature on the installer with a publicly trusted one.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and sign installer
    runs-on: windows-latest
    timeout-minutes: 720
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` refuses to package the privileged helper unless its
      # Authenticode signature verifies, so the certificate must exist before the
      # Tauri build runs its beforeBuildCommand.
      - name: Import code-signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw 'SIGNING_PFX_BASE64 is not configured; see .github/SIGNING.md'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'SIGNING_PFX_PASSWORD is not configured; see .github/SIGNING.md'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString -String $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password

          # signtool verify /pa evaluates the Authenticode policy, which requires a
          # trusted chain. Trusting the certificate on the runner mirrors a client
          # machine that installed the public certificate.
          $cerPath = Join-Path $env:RUNNER_TEMP 'code-signing.cer'
          Export-Certificate -Cert $imported -FilePath $cerPath -Type CERT | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null

          Remove-Item -LiteralPath $pfxPath -Force
          Write-Output "Imported signing certificate $($imported.Thumbprint)"

      - name: Build signed installer
        shell: pwsh
        env:
          # Windows PowerShell must find the inbox Security module; the release
          # helper gate and signing script both rely on the certificate stores.
          TRUONGPHATCOMPUTER_PRIVILEGED_SIGN_COMMAND: '["powershell.exe","-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-File","scripts/sign-windows.ps1","{file}"]'
        run: pnpm tauri build

      - name: Verify installer signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target\release\bundle\nsis\*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer was produced' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is $($signature.Status): $($signature.StatusMessage)"
          }
          Write-Output "Verified $($installer.Name) signed by $($signature.SignerCertificate.Subject)"

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: nsis-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  # Optional publicly trusted signing through SignPath Foundation. Enable it by
  # setting the repository variable SIGNPATH_PROJECT_SLUG after the project is
  # approved; the job stays skipped until then.
  signpath:
    name: Sign installer with SignPath
    needs: build
    if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
    runs-on: windows-latest
    steps:
      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload publicly signed installer
        uses: actions/upload-artifact@v4
        with:
          name: nsis-installer-signpath
          path: signed/*.exe
          if-no-files-found: error
          retention-days: 14
